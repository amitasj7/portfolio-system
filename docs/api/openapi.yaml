openapi: 3.0.0

info:
  title: Portfolio Backend APIs
  version: 1.0.0
  description: |
    Full API reference for the Portfolio Backend.
    This file serves as the single source of truth for the API contract.
    Import this file into Postman to generate a complete collection with structured folders and examples.

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Health
    description: System Health Checks
  - name: Public / Profile
    description: Publicly accessible profile data
  - name: Public / Projects
    description: Publicly accessible project data
  - name: Public / Timeline
    description: Publicly accessible timeline data
  - name: Public / Resume
    description: Publicly accessible resume data
  - name: Admin / Auth
    description: Admin authentication endpoints
  - name: Admin / Profile
    description: Admin profile management
  - name: Admin / Projects
    description: Admin project management
  - name: Admin / Timeline
    description: Admin timeline management
  - name: Admin / Resume
    description: Admin resume management
  - name: Admin / Leads
    description: Admin lead management

paths:
  # ============================
  # HEALTH CHECK
  # ============================
  /health:
    get:
      summary: Check health status
      tags: [Health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  # ============================
  # PUBLIC APIs (v1)
  # ============================
  /api/v1/profile:
    get:
      summary: Get public profile
      tags: [Public / Profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /api/v1/projects:
    get:
      summary: Get public projects
      tags: [Public / Projects]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'

  /api/v1/timeline:
    get:
      summary: Get public timeline
      tags: [Public / Timeline]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Timeline'

  /api/v1/resume:
    get:
      summary: Get public resume
      tags: [Public / Resume]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'

  # ============================
  # ADMIN APIs
  # ============================
  
  # --- Auth ---
  /admin/auth/login:
    post:
      summary: Admin Login
      tags: [Admin / Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "admin@example.com"
                password:
                  type: string
                  example: "secret123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
  
  /admin/auth/logout:
    post:
      summary: Admin Logout
      tags: [Admin / Auth]
      responses:
        '200':
          description: Logout successful

  /admin/auth/me:
    get:
      summary: Verify Admin Session
      tags: [Admin / Auth]
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  isAuthenticated:
                    type: boolean
                  user:
                    type: object

  # --- Profile ---
  /admin/profile:
    get:
      summary: Get admin profile
      tags: [Admin / Profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
    put:
      summary: Update profile
      tags: [Admin / Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  # --- Projects ---
  /admin/projects:
    get:
      summary: Get all projects (including hidden)
      tags: [Admin / Projects]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Create project
      tags: [Admin / Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /admin/projects/{id}:
    put:
      summary: Update project
      tags: [Admin / Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      summary: Delete project
      tags: [Admin / Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted

  # --- Timeline ---
  /admin/timeline:
    get:
      summary: Get all timeline items
      tags: [Admin / Timeline]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Timeline'
    post:
      summary: Create timeline item
      tags: [Admin / Timeline]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'

  /admin/timeline/{id}:
    put:
      summary: Update timeline item
      tags: [Admin / Timeline]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
    delete:
      summary: Delete timeline item
      tags: [Admin / Timeline]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted

  # --- Resume ---
  /admin/resume:
    get:
      summary: Get resume metadata
      tags: [Admin / Resume]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
    put:
      summary: Update resume metadata
      tags: [Admin / Resume]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                isPublic:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'

  /admin/resume/upload:
    post:
      summary: Upload resume file (PDF)
      tags: [Admin / Resume]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded

  # --- Leads ---
  /admin/leads:
    get:
      summary: Get all leads
      tags: [Admin / Leads]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lead'

  /admin/leads/{id}:
    get:
      summary: Get lead details
      tags: [Admin / Leads]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
    delete:
      summary: Delete lead
      tags: [Admin / Leads]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted

components:
  schemas:
    Profile:
      type: object
      properties:
        full_name:
          type: string
          example: "John Doe"
        title:
          type: string
          example: "Full Stack Developer"
        bio:
          type: string
        location:
          type: string
        social_links:
          type: object
          properties:
            github:
              type: string
            linkedin:
              type: string
        skills:
          type: array
          items:
            type: string

    Project:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        techStack:
          type: array
          items:
            type: string
        repoUrl:
          type: string
        demoUrl:
          type: string
        isVisible:
          type: boolean
        order:
          type: number
    
    ProjectInput:
      type: object
      properties:
        title:
          type: string
          example: "Portfolio Website"
        description:
          type: string
          example: "My personal site content management system."
        techStack:
          type: array
          items:
            type: string
          example: ["Node.js", "Express", "TypeScript"]
        repoUrl:
          type: string
          example: "https://github.com/user/project"
        demoUrl:
          type: string
        isVisible:
          type: boolean
          default: true
        order:
          type: number

    Timeline:
      type: object
      properties:
        _id:
          type: string
        type:
          type: string
          enum: [education, experience]
        title:
          type: string
        organization:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        description:
          type: string
        isVisible:
          type: boolean
        order:
          type: number

    TimelineInput:
      type: object
      required: [type, title, organization]
      properties:
        type:
          type: string
          enum: [education, experience]
          example: "experience"
        title:
          type: string
          example: "Senior Engineer"
        organization:
          type: string
          example: "Google"
        startDate:
          type: string
          example: "2023-01-01"
        endDate:
          type: string
        description:
          type: string
        isVisible:
          type: boolean
          default: true

    Resume:
      type: object
      properties:
        summary:
          type: string
        fileUrl:
          type: string
        isPublic:
          type: boolean

    Lead:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
